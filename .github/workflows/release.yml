name: Build e release

# A cada push na branch principal: roda testes, gera o .exe portátil do Windows
# e publica uma Release "v<versão do package.json>" (se essa versão ainda não tiver release).
# Para lançar nova versão: suba o "version" no package.json e faça push.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Push novo cancela a execução anterior: evita duas pipelines publicando a mesma release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build-windows:
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Smoke test (servidor no Node do Electron)
        shell: bash
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: |
          ELECTRON_RUN_AS_NODE= node node_modules/electron/install.js
          electron_bin=$(ELECTRON_RUN_AS_NODE= node -p "require('electron')")
          set +e
          out=$("$electron_bin" scripts/smoke.ts 2>&1); code=$?
          echo "$out"
          if [ $code -ne 0 ]; then echo "::error title=smoke test::exit $code: $(echo "$out" | tr '\r\n' '  ' | cut -c1-3000)"; fi
          exit $code
      - run: npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v5
        with:
          name: fin-control-${{ steps.version.outputs.version }}-win-x64
          path: release/*.exe
          if-no-files-found: error

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build-windows.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: fin-control-${{ needs.build-windows.outputs.version }}-win-x64
          path: dist
      - name: Publicar release v${{ env.VERSION }}
        run: |
          # Cópia com nome fixo: o link de download do README sempre aponta para a última versão.
          cp dist/*.exe dist/Fin-Control-portable.exe
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            if ! gh release view "v$VERSION" --json assets -q '.assets[].name' | grep -qx Fin-Control-portable.exe; then
              gh release upload "v$VERSION" dist/Fin-Control-portable.exe
            fi
            echo "Release v$VERSION já existe — suba a versão no package.json para publicar outra."
            exit 0
          fi
          gh release create "v$VERSION" dist/*.exe \
            --target "$GITHUB_SHA" \
            --title "Fin Control $VERSION" \
            --notes "Executável portátil para Windows (x64). Baixe o .exe abaixo e veja o passo a passo no README."
